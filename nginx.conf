server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare/Traefik HTTPS terminate ediyor; nginx HTTP'de.
    # absolute_redirect off → relative redirect (browser scheme'i korur).
    # Astro `trailingSlash: 'always'` ile uyumlu.
    absolute_redirect off;
    port_in_redirect off;

    # --- Security headers (CF Strict mode ile uyumlu) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff2;

    # --- Static assets: immutable 1y cache ---
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|avif|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- HTML: no-cache, always fresh ---
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # --- Astro trailingSlash: 'always' ---
    # /urunler/ → urunler/index.html (200)
    # /urunler  → 301 → /urunler/ ($uri/ dizin match'i redirect tetikler)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # --- Special files ---
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }
    location = /sitemap-index.xml { access_log off; }

    # --- Errors ---
    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- Dot files ---
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
