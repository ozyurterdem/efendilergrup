<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Efendiler Group — Cotton Ihr. Sti">
  <defs>
    <style>
      .brand   { font-family: "Source Serif 4", "Playfair Display", Georgia, serif; fill: #14253F; }
      .tagline { font-family: "Inter", "Helvetica Neue", sans-serif; fill: #14253F; }
      .address { font-family: "Inter", "Helvetica Neue", sans-serif; fill: #6B7280; }
      .rule    { stroke: #4A7FA7; }
      .cotton  { fill: #FAFAF6; stroke: #B8885C; stroke-width: 1.6; }
      .seam    { fill: none; stroke: #B8885C; stroke-width: 1; }
      .leaf    { fill: #6F8A3C; stroke: #5C7230; stroke-width: 0.6; }
      .leaf-lt { fill: #7A9548; stroke: #5C7230; stroke-width: 0.6; }
    </style>
  </defs>

  <!-- Pamuk koza + yaprak -->
  <g transform="translate(300 55)">
    <!-- 2 yaprak (sağ üst) -->
    <path class="leaf"    d="M 16 -22 C 28 -34 40 -28 42 -18 C 38 -12 22 -12 14 -14 Z"/>
    <path class="leaf-lt" d="M 26 -14 C 40 -10 44 -2 40 4 C 32 2 22 -4 22 -10 Z"/>

    <!-- Koza: 4 petal (arka -> ön sırayla) -->
    <ellipse class="cotton" cx="0"   cy="-14" rx="11" ry="13"/>
    <ellipse class="cotton" cx="-15" cy="-4"  rx="12" ry="14"/>
    <ellipse class="cotton" cx="15"  cy="-4"  rx="12" ry="14"/>
    <ellipse class="cotton" cx="0"   cy="8"   rx="15" ry="13"/>

    <!-- Petal dokusu (ince dikiş kıvrımları) -->
    <path class="seam" d="M -8 -6  Q -4 -10 0 -6"/>
    <path class="seam" d="M  0 -6  Q  4 -10 8 -6"/>
    <path class="seam" d="M -10 4 Q -4 8  0 4"/>
    <path class="seam" d="M  0  4 Q  4  8 10 4"/>
    <path class="seam" d="M -4 -14 Q  0 -18 4 -14"/>
  </g>

  <!-- Yanlardaki yatay çizgiler -->
  <line class="rule" x1="40"  y1="155" x2="180" y2="155" stroke-width="1.3"/>
  <line class="rule" x1="420" y1="155" x2="560" y2="155" stroke-width="1.3"/>

  <!-- EFENDILER ana metin -->
  <text class="brand" x="300" y="170" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="5">EFENDILER</text>

  <!-- İnce alt çizgi (tagline üstü) -->
  <line class="rule" x1="245" y1="195" x2="355" y2="195" stroke-width="0.8"/>

  <!-- GROUP COTTON IHR. STI alt başlık -->
  <text class="tagline" x="300" y="216" text-anchor="middle" font-size="17" font-weight="500" letter-spacing="5.5">GROUP COTTON IHR. STI</text>

  <!-- Alt ayırıcı çizgi + adres -->
  <line x1="40" y1="240" x2="560" y2="240" stroke="#14253F" stroke-width="0.8"/>
  <text class="address" x="300" y="255" text-anchor="middle" font-size="12.5" font-weight="400" letter-spacing="2.5">HAL MAH. MAH. 6025 SK. NO: 108 A AKDENIZ / MERSIN / TURKEY</text>
</svg>
