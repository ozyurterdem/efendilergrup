<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Efendiler Group Cotton">
  <defs>
    <style>
      .brand   { font-family: "Source Serif 4", "Playfair Display", Georgia, serif; fill: #FAFAF6; }
      .tagline { font-family: "Inter", "Helvetica Neue", sans-serif; fill: #FAFAF6; }
      .rule    { stroke: #9FC3E0; }
      .cotton  { fill: #FAFAF6; stroke: #D4A874; stroke-width: 1.6; }
      .seam    { fill: none; stroke: #D4A874; stroke-width: 1; }
      .leaf    { fill: #9FBC5A; stroke: #7A9548; stroke-width: 0.6; }
      .leaf-lt { fill: #B8D170; stroke: #7A9548; stroke-width: 0.6; }
    </style>
  </defs>

  <g transform="translate(300 55)">
    <path class="leaf"    d="M 16 -22 C 28 -34 40 -28 42 -18 C 38 -12 22 -12 14 -14 Z"/>
    <path class="leaf-lt" d="M 26 -14 C 40 -10 44 -2 40 4 C 32 2 22 -4 22 -10 Z"/>
    <ellipse class="cotton" cx="0"   cy="-14" rx="11" ry="13"/>
    <ellipse class="cotton" cx="-15" cy="-4"  rx="12" ry="14"/>
    <ellipse class="cotton" cx="15"  cy="-4"  rx="12" ry="14"/>
    <ellipse class="cotton" cx="0"   cy="8"   rx="15" ry="13"/>
    <path class="seam" d="M -8 -6  Q -4 -10 0 -6"/>
    <path class="seam" d="M  0 -6  Q  4 -10 8 -6"/>
    <path class="seam" d="M -10 4 Q -4 8  0 4"/>
    <path class="seam" d="M  0  4 Q  4  8 10 4"/>
    <path class="seam" d="M -4 -14 Q  0 -18 4 -14"/>
  </g>

  <line class="rule" x1="40"  y1="155" x2="180" y2="155" stroke-width="1.3"/>
  <line class="rule" x1="420" y1="155" x2="560" y2="155" stroke-width="1.3"/>
  <text class="brand" x="300" y="170" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="5">EFENDILER</text>
  <line class="rule" x1="245" y1="195" x2="355" y2="195" stroke-width="0.8"/>
  <text class="tagline" x="300" y="216" text-anchor="middle" font-size="17" font-weight="500" letter-spacing="5.5">GROUP COTTON IHR. STI</text>
</svg>
